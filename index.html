<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ビカリエ</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="js/questions.js" defer></script>
    <script src="js/data.js" defer></script>
    <script src="js/diagnosis.js" defer></script>
    <script src="js/main.js" defer></script>
</head>

<body>
    <main class="app">
        <section id="startScreen" class="start screen active">
            <h1>ビカクシダソムリエ</h1>
            <p>
                ビカクシダは、個性的な見た目とインテリアとしての飾りやすさから人気を集めている観葉植物です。
                いくつかの質問に答えると、18種の原種の中からあなたにぴったりのビカクシダをご提案します。

            </p>

            <button id="startButton">
                診断をはじめる
            </button>
        </section>

        <section id="questionScreen" class="question screen">
            <h1>質問</h1>
            <p id="progress" class="progress">1 / 6</p>

            <p id="questionText" class="questionText"></p>

            <div id="answerList" class="answerList"></div>
        </section>

        <section id="resultScreen" class="result screen">
            <h1>あなたにおすすめのビカクシダは・・・</h1>

            <div id="resultList" class="resultList"></div>

            <a id="searchButton" class="searchButton" href="https://www.google.com/search?q=ビカクシダ+育て方" target="_blank"
                rel="noopener noreferrer">
                育て方を調べる
            </a>

            <button id="backToStartButton" class="backToStartButton">
                もう一度診断する
            </button>
        </section>
    </main>
</body>

</html>
