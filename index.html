<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ビカリエ</title>
    <link rel="stylesheet" href="css/style.css" class="rel">
    <script src="js/main.js" defar></script> <!-- defarでHTMLを読み込み後にJSを実行 -->
</head>

<body>
    <main class="app"> <!-- .appでアプリ全体のCSSを決める -->
        <section id="startScreen" class="start screen">
            <div class="titleBand">
                <h1>ビカクシダソムリエ</h1>
            </div>

            <p>インテリアプランツとしてここ数年の間で大きく名を馳せたビカクシダ。
                <br>育ててみたいけれど初心者だから枯らさないか心配、どんな品種があるのか知りたい。
                <br>そんなあなたに、ビカクシダの原種18種からおすすめの品種を診断します。
            </p>

            <button id="startButton">
                診断をはじめる
            </button>
        </section>

        <section class="question screen active">
            <h1>質問</h1>
            <p class="progres">1/6</p>
            <p class="questionText">水やりの頻度はどれくらいがいい？</p>
            <div class="answerList">
                <button class="answerButton">多め</button>
                <button class="answerButton">普通</button>
                <button class="answerButton">少なめ</button>
            </div>
        </section>

    </main>
</body>

</html>
